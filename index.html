<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Authentication</title>
    <!-- Supabase Connection Link via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h2>User Registration (Sign Up)</h2>
    
    <!-- User inputs for email and password -->
    <input type="email" id="user-email" placeholder="Enter your email" required><br><br>
    <input type="password" id="user-password" placeholder="Enter your password" required><br><br>
    
    <!-- Button to trigger registration -->
    <button onclick="registerUser()">Sign Up</button>

    <!-- Status message placeholder -->
    <p id="status-message" style="color: blue; font-weight: bold;"></p>

    <script>
        // Replace these credentials with your actual Supabase details
        const SUPABASE_URL = "https://fynickiyemkdqopphkzk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5bmlja2l5ZW1rZHFvcHBoa3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwODY3NDMsImV4cCI6MjEwNDY2Mjc0M30.P4MzfRpMdAHxCasRsijreTJm8IefNtxHt7Lvf6Xsy5g"; // <-- Paste your Anon Key here

        // Initialize Supabase Client
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Sign Up Function
        async function registerUser() {
            const emailInput = document.getElementById('user-email').value;
            const passwordInput = document.getElementById('user-password').value;
            const statusText = document.getElementById('status-message');

            statusText.style.color = "blue";
            statusText.innerText = "Processing...";

            // Built-in Supabase function to sign up users
            const { data, error } = await supabase.auth.signUp({
                email: emailInput,
                password: passwordInput,
            });

            if (error) {
                statusText.style.color = "red";
                statusText.innerText = "Error: " + error.message;
            } else {
                statusText.style.color = "green";
                statusText.innerText = "Signup Successful! Please check your email inbox to verify your account.";
            }
        }
    </script>
</body>
</html>
